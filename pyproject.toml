[project]
name = "object-detection"
version = "0.1.0"
description = "Webcam object detection with YOLOE-26"
requires-python = ">=3.13"
dependencies = [
    "nicegui>=3.13.0",
    "ultralytics>=8.4.60",
    "opencv-python>=4.9.0",
    "pyobjc-framework-AVFoundation>=10 ; platform_system == 'Darwin'",
    "mediapipe>=0.10.35",
    "uniface[cpu]>=3.7.1",
    "clip",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
    "basedpyright>=1.39",
    "pre-commit>=4",
]

[tool.uv]
package = true
default-groups = "all"

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }

[tool.ruff.lint]
ignore = ["E402"]
[tool.ruff.format]
docstring-code-format = true
