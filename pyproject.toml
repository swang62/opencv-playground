[project]
name = "object-detection"
version = "0.1.0"
description = "Webcam object detection with YOLOE-26"
requires-python = ">=3.13"
dependencies = [
    "nicegui>=3.13.0",
    "ultralytics>=8.4.60",
    "opencv-python>=4.9.0",
    "pyobjc-framework-AVFoundation>=10 ; platform_system == 'Darwin'",
    "mediapipe>=0.10.35",
    "uniface[cpu]>=3.7.1",
    "faiss-cpu>=1.11.0",
    "clip",
    "lap>=0.5.12",
    "onnxruntime>=1.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
    "basedpyright>=1.39",
    "pre-commit>=4",
]

[tool.uv]
package = true
default-groups = "all"

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }

[tool.ruff.lint]
ignore = [
    "E402",    # import not at top of file (lazy imports / NiceGUI ordering)
    "BLE001",  # blind Exception catch — intentional for fault isolation
    "S110",    # try-except-pass — intentional for non-critical paths
    "SIM117",  # nested with — NiceGUI UI nesting is structural, not flattenable
    "PLW0602", # using global for name without assignment — read-only globals are fine
    "PLW0642", # reassigning self — objc bridging pattern in camera.py
]
[tool.ruff.lint.per-file-ignores]
"src/sources/camera.py" = ["PLW0642"]

[tool.pyright]
ignore = ["src/sources/camera.py"]
reportMissingTypeStubs = false
reportMissingParameterType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportAny = false
reportUnusedCallResult = false
reportUnusedVariable = false
reportUnannotatedClassAttribute = false
reportUnusedImport = false
reportUnnecessaryIsInstance = false
reportUntypedBaseClass = false
reportOptionalMemberAccess = false
reportArgumentType = false
reportMissingTypeArgument = false
reportCallIssue = false
reportUnnecessaryTypeIgnoreComment = false
reportIgnoreCommentWithoutRule = false


[tool.ruff.format]
docstring-code-format = true
